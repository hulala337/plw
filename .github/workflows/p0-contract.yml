name: P0 contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  p0-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile app.py tools/p0_acceptance.py tools/p1_acceptance.py tools/p0_p1_integration.py
      - name: JavaScript syntax check
        run: node --check web/assets/app.js
      - name: Run deterministic P0 contract checker
        run: python tools/p0_acceptance.py
