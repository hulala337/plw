name: P1 Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  p1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run P1 contract
        run: python tools/p1_acceptance.py
