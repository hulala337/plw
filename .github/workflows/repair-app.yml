name: Repair app.py

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source repairs
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = '''        if last_xy is not None:\n            dist = math.hypot(xi-last_xy[0], yi-last_xy[1])\n            # pynput reports Windows virtual-desktop coordinates, including\n            # negative coordinates for displays placed left/above primary.\n            if dist < 5000:\n                payload = {"cursor_distance_px":dist}\n                if last_monitor_index is not None and current_monitor is not None and current_monitor != last_monitor_index:\n                    payload["monitor_switches"] = 1\n                queue_input(**payload)\n'''
          new = '''        if last_xy is not None:\n            dist = math.hypot(xi-last_xy[0], yi-last_xy[1])\n            # Count the full virtual-desktop movement. Do not discard large\n            # jumps: on 4K/multi-monitor layouts a legitimate move can exceed\n            # 5000 px. pynput uses Windows virtual-desktop coordinates, so\n            # negative X/Y values for left/above monitors are handled naturally.\n            if math.isfinite(dist) and dist >= 0:\n                payload = {"cursor_distance_px": dist}\n                if last_monitor_index is not None and current_monitor is not None and current_monitor != last_monitor_index:\n                    payload["monitor_switches"] = 1\n                queue_input(**payload)\n'''
          if old not in s:
              raise SystemExit('expected mouse-movement block not found')
          s = s.replace(old, new, 1)

          old = '''def monitor_at(x: int, y: int) -> int | None:\n    for m in refresh_monitor_layout():\n        if m["left"] <= x < m["right"] and m["top"] <= y < m["bottom"]:\n            return int(m["index"])\n    return None\n'''
          new = '''def monitor_at(x: int, y: int) -> int | None:\n    layout = refresh_monitor_layout()\n    for m in layout:\n        if m["left"] <= x < m["right"] and m["top"] <= y < m["bottom"]:\n            return int(m["index"])\n    # A monitor may have just been attached/detached or changed DPI/layout.\n    # Refresh immediately rather than waiting for the five-second cache.\n    layout = refresh_monitor_layout(force=True)\n    for m in layout:\n        if m["left"] <= x < m["right"] and m["top"] <= y < m["bottom"]:\n            return int(m["index"])\n    return None\n'''
          if old not in s:
              raise SystemExit('expected monitor_at block not found')
          s = s.replace(old, new, 1)

          old = '''    timeline=conn.execute("SELECT slice_start,category,seconds,events FROM activity_slices WHERE date(slice_start)=? ORDER BY slice_start", (today_key(),)).fetchall()\n    apps=conn.execute("SELECT category,seconds FROM app_usage WHERE day=? ORDER BY seconds DESC", (today_key(),)).fetchall()\n    sessions=conn.execute("SELECT id,started_at,ended_at,active_seconds,categories,ended_reason FROM focus_sessions WHERE date(started_at)=? ORDER BY started_at DESC", (today_key(),)).fetchall()\n'''
          new = '''    timeline=conn.execute("SELECT slice_start,category,seconds,events FROM activity_slices WHERE date(slice_start) BETWEEN ? AND ? ORDER BY slice_start", (start.isoformat(), end.isoformat())).fetchall()\n    apps=conn.execute("SELECT category,COALESCE(SUM(seconds),0) AS seconds FROM app_usage WHERE day BETWEEN ? AND ? GROUP BY category ORDER BY seconds DESC", (start.isoformat(), end.isoformat())).fetchall()\n    sessions=conn.execute("SELECT id,started_at,ended_at,active_seconds,categories,ended_reason FROM focus_sessions WHERE date(started_at) BETWEEN ? AND ? ORDER BY started_at DESC", (start.isoformat(), end.isoformat())).fetchall()\n'''
          if old not in s:
              raise SystemExit('expected range query block not found')
          s = s.replace(old, new, 1)

          marker = '''def main() -> None:\n    enforce_release_integrity()\n    init_db()\n    ensure_today()\n'''
          replacement = '''def recover_stale_sessions() -> None:\n    """Close sessions left open by a crash or forced termination."""\n    conn = db()\n    conn.execute(\n        "UPDATE focus_sessions SET ended_at=COALESCE(ended_at, started_at), ended_reason=CASE WHEN ended_reason='' THEN 'recovered' ELSE ended_reason END WHERE ended_at IS NULL"\n    )\n    conn.commit(); conn.close()\n\n\ndef self_test() -> int:\n    """Offline smoke test used by the Windows release pipeline."""\n    try:\n        init_db()\n        recover_stale_sessions()\n        ensure_today()\n        if not WEB.joinpath("index.html").is_file():\n            raise RuntimeError("web/index.html missing")\n        if not WEB.joinpath("assets").is_dir():\n            raise RuntimeError("web/assets missing")\n        if api.openapi().get("paths") is None:\n            raise RuntimeError("FastAPI routes were not registered")\n        info = display_info()\n        if not isinstance(info.get("count"), int):\n            raise RuntimeError("display detection returned invalid data")\n        print("Pelican Workbench self-test: PASS")\n        return 0\n    except Exception as exc:\n        print(f"Pelican Workbench self-test: FAIL: {exc}")\n        return 1\n\n\ndef main() -> None:\n    if "--self-test" in sys.argv:\n        return_code = self_test()\n        raise SystemExit(return_code)\n    enforce_release_integrity()\n    init_db()\n    recover_stale_sessions()\n    ensure_today()\n'''
          if marker not in s:
              raise SystemExit('expected main block not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit repaired app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete input tracking, monitor handling and release self-test"
          git push
