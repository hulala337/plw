<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="none" aria-hidden="true">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#e9ddc2"/></linearGradient>
 <linearGradient id="book1"><stop stop-color="#6e93a4"/><stop offset="1" stop-color="#476e80"/></linearGradient>
 <linearGradient id="book2"><stop stop-color="#d9a56e"/><stop offset="1" stop-color="#b87855"/></linearGradient>
 <linearGradient id="pot"><stop stop-color="#d99868"/><stop offset="1" stop-color="#a9604d"/></linearGradient>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
