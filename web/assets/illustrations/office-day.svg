<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-label="鹈鹕工作台白天办公室插画">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dceff5"/><stop offset=".62" stop-color="#f1eee5"/><stop offset="1" stop-color="#d6b28d"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8d6eb"/><stop offset="1" stop-color="#e6f1ed"/></linearGradient>
